# defaults:
#     - override hydra/launcher: submitit_local

# environment
task: push-cube
obs: rgb
episodic: false
device: cuda:0

# DINO goal-image reward -- TEMPORARY (2026-08-26), see envs/dino_goal_reward.py.
# Set dino_reward: false to restore the task's own dense reward.
dino_reward: false
dino_reward_model: dinov3_vits16
dino_reward_checkpoint: /data/AlexPleava/pretrained_checkpoints/dino/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
dino_reward_resize: 224
# "negative_distance" for r_t = -d_t (pays to reach AND hold), "delta" for r_t = d_{t-1} - d_t.
# The scale differs by shaping and is load-bearing -- TD-MPC2 bins values over vmin/vmax below.
# At discount 0.95 a 50-step episode is worth ~18.5x the per-step reward, so scale 1.0 puts
# negative_distance returns in about [-6, 0]. "delta" instead wants a scale near 20.0, since its
# return telescopes to d_0 - d_T (~0.15 raw).
dino_reward_shaping: negative_distance
dino_reward_scale: 1.0

# evaluation
checkpoint: ???
eval_episodes: 5
eval_freq: 10000

# training
steps: 1_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
run_name: ???
exp_name: default
data_dir: ???
output_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: Task-Specialized-Distillation
wandb_entity: alex-pleava-university-of-toronto
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: false
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
