# defaults:
#     - override hydra/launcher: submitit_local

# environment
task: lift-peg-upright
# 'rgb_state': the camera frame plus the same proprioceptive vector the DINO-based agents get
# (28-dim for pick-cube, 25 elsewhere -- see PROPRIO_KEYS in envs/custom_maniskill.py), so this
# baseline's non-visual input matches theirs. 'rgb' alone cannot represent pick-cube's target at
# all, since its goal marker is hidden from every camera.
obs: rgb_state
# Camera resolution for the ManiSkill tasks. Must be one of the stacks in common/layers.py's
# CONV_STACKS (64 or 224); both flatten to num_channels*16 = latent_dim, so the encoder's output
# width is unaffected either way.
#
# 64 is stock TD-MPC2 and what its tuning assumes. 224 is what the recorded datasets and the
# DINO-based agents use, but measured at H=3/B=256 on a 4090 it costs ~15x the encode time
# (6.4 -> 93.7 ms), 11x the activation memory, and 12x the replay storage -- 451 GB at
# buffer_size: 1_000_000 below, which does not fit in this machine's 125 GB of RAM. It also
# leaves ShiftAug(pad=3) shifting 1.3% of the frame instead of 4.7%, weakening the augmentation
# TD-MPC2 is tuned around. Raising this means lowering buffer_size and rescaling that pad.
camera_resolution: 224
episodic: false
device: cuda:1

# DINO goal-image reward -- TEMPORARY (2026-08-26), see envs/dino_goal_reward.py.
# Set dino_reward: false to restore the task's own dense reward.
dino_reward: false
dino_reward_model: dinov3_vits16
dino_reward_checkpoint: /data/AlexPleava/pretrained_checkpoints/dino/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
dino_reward_resize: 224
# "negative_distance" for r_t = -d_t (pays to reach AND hold), "delta" for r_t = d_{t-1} - d_t.
# The scale differs by shaping and is load-bearing -- TD-MPC2 bins values over vmin/vmax below.
# At discount 0.95 a 50-step episode is worth ~18.5x the per-step reward, so scale 1.0 puts
# negative_distance returns in about [-6, 0]. "delta" instead wants a scale near 20.0, since its
# return telescopes to d_0 - d_T (~0.15 raw).
dino_reward_shaping: negative_distance
dino_reward_scale: 1.0

# evaluation
checkpoint: ???
eval_episodes: 5
eval_freq: 10000

# training
steps: 1_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 100_000
run_name: ???
exp_name: s2p_encoder
data_dir: ???
output_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# encoder
# 'cnn' is TD-MPC2's own from-scratch encoder. 'dino_cap' is a frozen DINOv3 backbone with a
# trainable cross-attention-pooling head, built from S2P's classes (so `s2p` must be importable),
# for obs='rgb_state' only. It wants camera_resolution=224, and runs DINO on every frame of
# every sampled window -- see common/dino_cap.py.
encoder: dino_cap
dino_model: dinov3_vits16
dino_checkpoint: /data/AlexPleava/pretrained_checkpoints/dino/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
dino_resize: 224
cap_embedding_dim: 512
cap_n_heads: 4
cap_n_queries: 4
cap_ff_hidden_layers: 2
cap_ff_hidden_dim: 512
cap_n_blocks: 1

# logging
wandb_project: Task-Specialized-Distillation
wandb_entity: alex-pleava-university-of-toronto
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: false
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
