# defaults:
#     - override hydra/launcher: submitit_local

# environment
task: ???
# 'rgb_state': the camera frame plus the same proprioceptive vector the DINO-based agents get
# (28-dim for pick-cube, 25 elsewhere -- see PROPRIO_KEYS in envs/custom_maniskill.py), so this
# baseline's non-visual input matches theirs. 'rgb' alone cannot represent pick-cube's target at
# all, since its goal marker is hidden from every camera.
obs: rgb_state
# Under 'rgb_state', stack the proprio vector over the same num_frames as the camera frames
# (concatenated oldest first), giving the agent the proprio history the S2P agents get from their
# frame stack. Off keeps the single-frame vector above, which is what existing checkpoints expect.
stack_proprio: true
# Camera resolution for the ManiSkill tasks. Must be one of the stacks in common/layers.py's
# CONV_STACKS (64 or 224); both flatten to num_channels*16 = latent_dim, so the encoder's output
# width is unaffected either way.
#
# 64 is stock TD-MPC2 and what its tuning assumes. 224 is what the recorded datasets and the
# DINO-based agents use, but measured at H=3/B=256 on a 4090 it costs ~15x the encode time
# (6.4 -> 93.7 ms), 11x the activation memory, and 12x the replay storage -- 451 GB at
# buffer_size: 1_000_000 below, which does not fit in this machine's 125 GB of RAM. It also
# leaves ShiftAug(pad=3) shifting 1.3% of the frame instead of 4.7%, weakening the augmentation
# TD-MPC2 is tuned around. Raising this means lowering buffer_size and rescaling that pad.
camera_resolution: 64
# Downsample each camera frame to this (area interpolation) before the encoder and the replay
# buffer; null feeds them camera_resolution as is. Must be a CONV_STACKS resolution. E.g.
# camera_resolution=224 with encoder_resolution=64 renders the scene at the DINO agents'
# resolution while costing what 64 does.
encoder_resolution: null
# Render the scene at this resolution and bilinearly upsample each frame to camera_resolution, before
# the encoder and the replay buffer; null renders at camera_resolution. The encoder, buffer and
# ShiftAug then run at camera_resolution exactly as without it, but the image is a native render at
# this resolution: camera_resolution=224 with lowpass_resolution=64 is the 224 recipe seeing what a
# 64 px run sees. Not combinable with encoder_resolution.
lowpass_resolution: null
# Perturbation classes for custom_maniskill_tasks' `make_env` (see its README), e.g.
# {lighting: {brightness: 1.5}}; null is the stock scene. Only for a task without perturbations
# of its own, so a `-dr` task's randomization is never quietly replaced.
perturbations: null
episodic: false
device: cuda:1

# evaluation
checkpoint: ???
eval_episodes: 5
eval_freq: 10000

# training
steps: 1_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
run_name: ???
exp_name: default
data_dir: ???
output_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# encoder
# 'cnn' is TD-MPC2's own from-scratch encoder. 'dino_cap' is a frozen DINOv3 backbone with a
# trainable cross-attention-pooling head, built from S2P's classes (so `s2p` must be importable),
# for obs='rgb_state' only. It wants camera_resolution=224. Without dino_cache it runs DINO on
# every frame of every sampled window -- see common/dino_cap.py.
encoder: cnn
dino_model: dinov3_vits16
dino_checkpoint: /data/AlexPleava/pretrained_checkpoints/dino/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
dino_resize: 224
# Run DINO once per env step, in the env, and store its patch features in the buffer in place of
# the rgb frames (same bytes per step), so updates run no DINO. Needs encoder: dino_cap. See
# envs/wrappers/dino_features.py.
dino_cache: false
cap_embedding_dim: 512
cap_n_heads: 4
cap_n_queries: 4
cap_ff_hidden_layers: 2
cap_ff_hidden_dim: 512
cap_n_blocks: 1

# logging
wandb_project: Task-Specialized-Distillation
wandb_entity: alex-pleava-university-of-toronto
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: false
save_video: true
save_agent: true
seed: 1

