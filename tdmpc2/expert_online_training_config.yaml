# defaults:
#     - override hydra/launcher: submitit_local

# environment
task: ???
obs: state
episodic: false
device: cuda:0

# evaluation
checkpoint: null
eval_episodes: 5
eval_freq: 50_000

# training
training_mode: online
steps: 1_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ???
data_name: mt30-{.task}-training.pt
eval_tasks:
  - cheetah-flip
# The below control how the state dict for a past checkpoint is loaded
# You may want to not load the weights for certain modules and train
# from scratch, or freeze certain modules.
  # - encoder
  # - dynamics
  # - value
  # - reward
  # - task
components_to_train_from_scratch: []
components_to_freeze: []

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: 5
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
run_name: ???
wandb_project: Task-Specialized-Distillation
wandb_entity: alex-pleava-university-of-toronto
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: false
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: false
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: 1000
bin_size: ???

run_name: ???
